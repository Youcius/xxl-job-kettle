version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xxl-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: xxl_job
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../server/xxl-job-admin/src/main/resources/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ../server/xxl-job-admin
      dockerfile: Dockerfile
    container_name: xxl-admin
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
      PARAMS: >-
        --server.port=8080
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root_pwd
        --xxl.kettle.path=/opt/data-integration
        --xxl.kettle.file.store-path=/data/etl/jobs
        --xxl.kettle.log.path=/data/etl/logs
    ports:
      - "8080:8080"
    volumes:
      - kettle-files:/data/etl/jobs
      - kettle-logs:/data/etl/logs
    networks:
      - default

  executor:
    build:
      context: ../server/xxl-job-executor-samples/xxl-job-executor-sample-springboot
      dockerfile: Dockerfile
    container_name: xxl-executor
    restart: always
    depends_on:
      - admin
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      PARAMS: >-
        --server.port=9999
        --xxl.job.admin.addresses=http://admin:8080/xxl-job-admin
        --xxl.job.executor.appname=xxl-job-executor-sample
        --xxl.job.executor.port=9999
        --xxl.job.executor.logpath=/data/applogs/xxl-job
        --xxl.job.admin.accessToken=default_token
    ports:
      - "9999:9999"
    volumes:
      - kettle-files:/data/etl/jobs:ro
      - kettle-logs:/data/etl/logs
    networks:
      - default

  frontend:
    image: nginx:alpine
    container_name: xxl-frontend
    restart: always
    depends_on:
      - admin
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - default

volumes:
  mysql-data:
  kettle-files:
  kettle-logs:

networks:
  default:
    driver: bridge
