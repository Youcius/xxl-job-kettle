# xxl-job-kettle production deployment
#
# Topology:
#   ┌─────────────┐     HTTP    ┌──────────────┐    RPC    ┌───────────────┐
#   │   MySQL     │◀───────────▶│  xxl-admin   │◀─────────▶│ xxl-executor  │
#   │  (xxl_job)  │             │  (port 8080) │           │ Java 11+jar   │
#   └─────────────┘             │ Vue 3 SPA    │           │ PENTAHO_JAVA_8│
#                               └──────────────┘           └───────┬───────┘
#                                                                   │ fork
#                                                                   ▼
#   ┌──────────────────────────────────────────────────────────────────────┐
#   │  Host: /opt/pdi/                                                     │
#   │    data-integration/      Kettle 9.1.0.0-324 (pan.sh / kitchen.sh)   │
#   │    jdk8/                  Temurin 1.8.0_482  (PENTAHO_JAVA_HOME)     │
#   │    jobs/                  Uploaded .ktr/.kjb task files             │
#   │    logs/                  Kettle run logs                            │
#   └──────────────────────────────────────────────────────────────────────┘
#
# IMPORTANT:
#   - Kettle 9.1 program lives on the HOST at /opt/pdi/data-integration
#   - Uploaded .ktr/.kjb files live on the HOST at /opt/pdi/jobs
#   - The patched admin jar now resolves JOB_FILE from xxl.kettle.file.store-path
#     (env XXL_KETTLE_FILE_STORE_PATH or JVM -D), so Kettle install and jobs root
#     can stay separate.

services:
  mysql:
    image: mysql:8.0
    container_name: xxl-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: xxl_job
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"          # host port remapped to avoid clashing with local mysql
    volumes:
      - mysql-data:/var/lib/mysql
      - ../server/xxl-job-admin/src/main/resources/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xxl-net

  admin:
    build:
      context: ../server/xxl-job-admin
      dockerfile: Dockerfile
    image: xxl-job-kettle/admin:2.5.0
    container_name: xxl-admin
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      XXL_KETTLE_FILE_STORE_PATH: /opt/pdi/jobs
      JAVA_OPTS: "-Xms512m -Xmx1g"
      PARAMS: >-
        --server.port=18081
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root_pwd
        --spring.mvc.static-path-pattern=/**
        --spring.web.resources.static-locations=file:/app-ui/,classpath:/static/
        --xxl.kettle.path=/opt/pdi/data-integration
        --xxl.kettle.file.store-path=/opt/pdi/jobs
        --xxl.kettle.log.path=/opt/pdi/logs
    ports:
      - "18081:18081"          # host and container both use 18081
    volumes:
      - ../web/dist:/app-ui:ro                                       # custom Vue frontend dist
      - /opt/pdi/data-integration:/opt/pdi/data-integration      # Kettle 9.1 install (pan.sh / kitchen.sh)
      - /opt/pdi/jobs:/opt/pdi/jobs                              # Uploaded .ktr/.kjb files (RW)
      - /opt/pdi/logs:/opt/pdi/logs                              # Kettle run logs
    networks:
      - xxl-net

  executor:
    build:
      context: ../server/xxl-job-executor-samples/xxl-job-executor-sample-springboot
      dockerfile: Dockerfile
    image: xxl-job-kettle/executor:2.5.0
    container_name: xxl-executor
    restart: always
    depends_on:
      - admin
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      # PENTAHO_JAVA_HOME tells Kettle 9.1 (pan.sh / kitchen.sh) which JVM to invoke.
      # The host /opt/pdi/jdk8 is bind-mounted into the container at the same path.
      PENTAHO_JAVA_HOME: /opt/pdi/jdk8
      PARAMS: >-
        --server.port=8082
        --xxl.job.admin.addresses=http://admin:18081/xxl-job-admin
        --xxl.job.executor.appname=xxl-job-executor-kettle
        --xxl.job.executor.address=http://executor:9999/
        --xxl.job.executor.port=9999
        --xxl.job.executor.logpath=/data/applogs/xxl-job
        --xxl.job.admin.accessToken=default_token
    # NOTE: neither port is exposed to the host.
    # - server.port 8082: Tomcat for httpJobHandler callback (intra-cluster only)
    # - xxl.job.executor.port 9999: EmbedServer Netty (admin -> executor RPC, intra-cluster only)
    volumes:
      - /opt/pdi/data-integration:/opt/pdi/data-integration:ro   # Kettle 9.1 install (read-only for safety)
      - /opt/pdi/jobs:/opt/pdi/jobs:ro                           # Uploaded .ktr/.kjb files read by pan.sh/kitchen.sh
      - /opt/pdi/jdk8:/opt/pdi/jdk8:ro                           # JDK 8 used by pan.sh
      - /opt/pdi/logs:/opt/pdi/logs                              # Kettle run logs (RW - pan.sh writes here)
    networks:
      - xxl-net

volumes:
  mysql-data:

networks:
  xxl-net:
    driver: bridge
